services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stillup-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      # Prefer .env for APP_ENV so `php artisan test` / phpunit.xml can use testing.
      # Do not hard-pin APP_ENV here — it leaks into PHPUnit and breaks CSRF handling.
      APP_KEY: ${APP_KEY:-}
    networks:
      - stillup
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: stillup-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stillup
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: stillup-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stillup}
      MYSQL_USER: ${DB_USERNAME:-stillup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - stillup-mysql:/var/lib/mysql
    networks:
      - stillup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: stillup-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - stillup-redis:/data
    networks:
      - stillup

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stillup-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    networks:
      - stillup
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stillup-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    networks:
      - stillup
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: stillup-mailhog
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILHOG_UI_PORT:-8025}:8025"
      - "${FORWARD_MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - stillup

networks:
  stillup:
    driver: bridge

volumes:
  stillup-mysql:
  stillup-redis:
